version: '3.8'
services:
  db:
    image: postgres:16
    container_name: team-management-system-postgres_db
    restart: always
    environment:
      POSTGRES_DB: team_management_system_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d team_management_system_db"]
      interval: 5s
      timeout: 5s
      retries: 5