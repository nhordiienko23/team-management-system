databaseChangeLog:
  - changeSet:
      id: 005-create-teams-table
      author: Nikita Hordiienko
      changes:
        - createTable:
            tableName: teams
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: creation_year
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: championship_title_count
                  type: INT
                  constraints:
                    nullable: false