<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Подключаем FontAwesome для иконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .login-container { max-width: 450px; margin: 50px auto; }
        /* Стили для красивого разделителя "OR" */
        .divider-custom {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1rem 0;
            color: #6c757d;
        }
        .divider-custom::before,
        .divider-custom::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #dee2e6;
        }
        .divider-custom:not(:empty)::before {
            margin-right: .25em;
        }
        .divider-custom:not(:empty)::after {
            margin-left: .25em;
        }
    </style>
</head>
<body>

<div class="container login-container">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h3 class="text-center mb-4">Welcome Back</h3>


            <div th:if="${param.error}" class="alert alert-danger">
                Invalid username or password.
            </div>
            <div th:if="${param.logout}" class="alert alert-info">
                You have been logged out.
            </div>
            <div th:if="${param.registered}" class="alert alert-success">
                Registration successful! Please log in.
            </div>


            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Log in</button>
            </form>


            <div class="divider-custom">
                <span class="px-2 small text-uppercase fw-bold">or</span>
            </div>


            <div class="d-grid gap-2">

                <a th:href="@{/oauth2/authorization/google}" class="btn btn-outline-danger">
                    <i class="fa-brands fa-google me-2"></i> Log in with Google
                </a>


                <a th:href="@{/oauth2/authorization/github}" class="btn btn-outline-dark">
                    <i class="fa-brands fa-github me-2"></i> Log in with GitHub
                </a>


                <a th:href="@{/oauth2/authorization/my-custom-auth}" class="btn btn-outline-primary">
                    <i class="fa-solid fa-shield-halved me-2"></i> Log in with Custom Server
                </a>
            </div>

            <div class="text-center mt-4">
                <p class="mb-0">Don't have an account? <a th:href="@{/register}">Register here</a></p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
