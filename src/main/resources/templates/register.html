<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <!-- Подключаем Bootstrap для красивого дизайна -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .register-container {
            max-width: 450px;
            margin: 50px auto;
        }
        .oauth-btn {
            width: 100%;
            margin-bottom: 10px;
            font-weight: 500;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #6c757d;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #dee2e6;
        }
        .divider:not(:empty)::before {
            margin-right: .5em;
        }
        .divider:not(:empty)::after {
            margin-left: .5em;
        }
    </style>
</head>
<body>

<div class="container register-container">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h3 class="text-center mb-4">Create an Account</h3>

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>


            <form th:action="@{/register}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required placeholder="Enter your username">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" name="email" required placeholder="name@example.com">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required placeholder="Create a password">
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">Register</button>
            </form>

            <div class="divider">OR</div>


            <a th:href="@{/oauth2/authorization/google}" class="btn btn-outline-danger oauth-btn">
                Register with Google
            </a>

            <a th:href="@{/oauth2/authorization/github}" class="btn btn-outline-dark oauth-btn">
                Register with GitHub
            </a>

            <a th:href="@{/oauth2/authorization/my-custom-auth}" class="btn btn-outline-primary oauth-btn">
                Register with Custom Auth Server
            </a>

            <div class="text-center mt-4">
                <p class="mb-0">Already have an account? <a th:href="@{/login}">Log in here</a></p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
